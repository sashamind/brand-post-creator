<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tula Marafon Posts</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Шрифты: Raleway для постов, Inter для интерфейса -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Raleway:ital,wght@0,400;0,600;0,800;1,800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-layout">

    <!-- ==================== ЛЕВАЯ ПАНЕЛЬ ==================== -->
    <div class="sidebar">

        <div class="app-logo">
    <span class="dot"></span>
    Tula Marafon Posts
</div>

        <!-- ФОРМАТ -->
        <div class="section">
            <div class="section-title">📐 Формат</div>
            <div class="format-grid">
    <button class="format-btn active" data-width="1080" data-height="1080" onclick="setFormat(this)">
        <span class="format-icon">◻️</span>
        <span class="format-label">Квадрат</span>
        <span class="format-size">1080×1080</span>
    </button>
    <button class="format-btn" data-width="1080" data-height="1350" onclick="setFormat(this)">
        <span class="format-icon">📸</span>
        <span class="format-label">Портрет</span>
        <span class="format-size">1080×1350</span>
    </button>
    <button class="format-btn" data-width="1080" data-height="1920" onclick="setFormat(this)">
        <span class="format-icon">📱</span>
        <span class="format-label">Stories</span>
        <span class="format-size">1080×1920</span>
    </button>
    <button class="format-btn" data-width="1920" data-height="1080" onclick="setFormat(this)">
        <span class="format-icon">🖥️</span>
        <span class="format-label">Широкий</span>
        <span class="format-size">1920×1080</span>
    </button>
    <button class="format-btn" data-width="1000" data-height="670" onclick="setFormat(this)">
        <span class="format-icon">🏷️</span>
        <span class="format-label">Баннер</span>
        <span class="format-size">1000×670</span>
    </button>
</div>
        </div>

        <!-- ТЕКСТ -->
        <div class="section">
            <div class="section-title">✏️ Текст</div>

            <!-- Заголовок -->
            <div class="input-group">
                <label>Заголовок</label>
                <textarea id="headingInput" oninput="updateCanvas()" class="heading-textarea" rows="2">важная
информация</textarea>
            </div>

            <!-- Подзаголовок -->
            <div class="input-group">
                <div class="label-with-toggle">
                    <label>Подзаголовок</label>
                    <label class="toggle-switch small">
                        <input type="checkbox" id="toggleSubtext" onchange="updateCanvas()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <textarea id="subtextInput" oninput="updateCanvas()" maxlength="120">забег переносится</textarea>
            </div>

            <div class="input-group">
                <label>Размер заголовка</label>
                <div class="slider-row">
                    <input type="range" id="fontSizeSlider" min="40" max="90" value="50" oninput="updateCanvas()">
<span class="slider-value" id="fontSizeValue">50px</span>
                </div>
            </div>

            <div class="input-group">
                <label>Цвет текста</label>
                <div class="color-options">
                    <div class="color-swatch active" style="background:#ffffff" data-color="#ffffff" onclick="setTextColor(this)"></div>
                    <div class="color-swatch" style="background:#000000; border:1px solid #555;" data-color="#000000" onclick="setTextColor(this)"></div>
                    <div class="color-swatch" style="background:#6c5ce7" data-color="#6c5ce7" onclick="setTextColor(this)"></div>
                    <div class="color-swatch" style="background:#00cec9" data-color="#00cec9" onclick="setTextColor(this)"></div>
                    <div class="color-swatch" style="background:#fdcb6e" data-color="#fdcb6e" onclick="setTextColor(this)"></div>
                    <div class="color-swatch" style="background:#e17055" data-color="#e17055" onclick="setTextColor(this)"></div>
                </div>
            </div>

            <div class="input-group">
                <label>↔️ Текст по горизонтали</label>
                <div class="slider-row">
                    <input type="range" id="textPosXSlider" min="0" max="100" value="50" step="1" oninput="updateCanvas()">
                    <span class="slider-value" id="textPosXValue">50%</span>
                </div>
            </div>

            <div class="input-group">
                <label>↕️ Текст по вертикали</label>
                <div class="slider-row">
                    <input type="range" id="textPosYSlider" min="0" max="100" value="50" step="1" oninput="updateCanvas()">
                    <span class="slider-value" id="textPosYValue">50%</span>
                </div>
            </div>
<div class="input-group">
    <div class="label-with-toggle">
        <label>Курсив (Italic)</label>
        <label class="toggle-switch small">
            <input type="checkbox" id="toggleItalic" onchange="updateCanvas()">
            <span class="toggle-slider"></span>
        </label>
    </div>
</div>
<div class="input-group">
    <div class="label-with-toggle">
        <label>Подложка под текст</label>
        <label class="toggle-switch small">
            <input type="checkbox" id="toggleTextBg" onchange="updateCanvas()">
            <span class="toggle-slider"></span>
        </label>
    </div>
    <div id="textBgColorRow" style="display:none; margin-top:8px;">
        <label>Цвет подложки</label>
        <div class="color-options">
    <div class="color-swatch text-bg-color active" style="background:#000000; border:1px solid #555;" data-color="#000000" onclick="setTextBgColor(this)"></div>
    <div class="color-swatch text-bg-color" style="background:#333333; border:1px solid #555;" data-color="#333333" onclick="setTextBgColor(this)"></div>
    <div class="color-swatch text-bg-color" style="background:#ffffff;" data-color="#ffffff" onclick="setTextBgColor(this)"></div>
    <div class="color-swatch text-bg-color" style="background:#6c5ce7;" data-color="#6c5ce7" onclick="setTextBgColor(this)"></div>
    <div class="color-swatch text-bg-color" style="background:#00cec9;" data-color="#00cec9" onclick="setTextBgColor(this)"></div>
    <div class="color-swatch text-bg-color" style="background:#e17055;" data-color="#e17055" onclick="setTextBgColor(this)"></div>
</div>
    </div>
</div>
            <div class="input-group">
                <label>Выравнивание</label>
                <div class="align-buttons">
                   <button class="align-btn active" data-align="left" onclick="setTextAlign(this)">◧</button>
<button class="align-btn" data-align="center" onclick="setTextAlign(this)">◫</button>
                </div>
            </div>

            <button class="btn-reset" onclick="resetTextPosition()">↺ Сбросить позицию текста</button>
        </div>

        <!-- ФОТОГРАФИЯ -->
        <div class="section">
            <div class="section-title">🖼️ Фотография</div>

            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
                <div id="uploadPlaceholder">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">Нажмите или перетащите фото</div>
                </div>
                <img id="uploadPreview" style="display:none;" alt="">
            </div>

            <div class="input-group" style="margin-top:12px;">
                <label>🔍 Масштаб фото</label>
                <div class="slider-row">
                    <input type="range" id="zoomSlider" min="100" max="400" value="100" step="1" oninput="updateCanvas()">
                    <span class="slider-value" id="zoomValue">×1.0</span>
                </div>
            </div>

            <div class="input-group">
                <label>↔️ Фото по горизонтали</label>
                <div class="slider-row">
                    <input type="range" id="posXSlider" min="-50" max="50" value="0" step="1" oninput="updateCanvas()">
                    <span class="slider-value" id="posXValue">0%</span>
                </div>
            </div>

            <div class="input-group">
                <label>↕️ Фото по вертикали</label>
                <div class="slider-row">
                    <input type="range" id="posYSlider" min="-50" max="50" value="0" step="1" oninput="updateCanvas()">
                    <span class="slider-value" id="posYValue">0%</span>
                </div>
            </div>

            <button class="btn-reset" onclick="resetImagePosition()">↺ Сбросить позицию фото</button>

            <div class="input-group" style="margin-top:12px;">
                <label>🌑 Затемнение фона</label>
                <div class="slider-row">
                    <input type="range" id="dimSlider" min="0" max="80" value="20" oninput="updateCanvas()">
<span class="slider-value" id="dimValue">20%</span>
                </div>
            </div>
        </div>

        <!-- ЭЛЕМЕНТЫ ДИЗАЙНА -->
        <div class="section">
            <div class="section-title">✦ Элементы дизайна</div>

            <div class="toggle-row">
    <label>Рамка</label>
    <label class="toggle-switch">
        <input type="checkbox" id="toggleFrame" onchange="updateCanvas()">
        <span class="toggle-slider"></span>
    </label>
</div>
<div class="input-group" style="margin-top:8px;">
    <label>Цвет рамки</label>
    <div class="color-options">
        <div class="color-swatch frame-color active" style="background:rgba(255,255,255,0.25); border:1px solid #555;" data-color="rgba(255,255,255,0.25)" onclick="setFrameColor(this)"></div>
        <div class="color-swatch frame-color" style="background:#ffffff" data-color="#ffffff" onclick="setFrameColor(this)"></div>
        <div class="color-swatch frame-color" style="background:#000000; border:1px solid #555;" data-color="#000000" onclick="setFrameColor(this)"></div>
        <div class="color-swatch frame-color" style="background:#6c5ce7" data-color="#6c5ce7" onclick="setFrameColor(this)"></div>
        <div class="color-swatch frame-color" style="background:#00cec9" data-color="#00cec9" onclick="setFrameColor(this)"></div>
        <div class="color-swatch frame-color" style="background:#fdcb6e" data-color="#fdcb6e" onclick="setFrameColor(this)"></div>
        <div class="color-swatch frame-color" style="background:#e17055" data-color="#e17055" onclick="setFrameColor(this)"></div>
    </div>
</div>
            
            <div class="toggle-row">
                <label>Акцентная линия</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggleAccentLine" checked onchange="updateCanvas()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
                        <!-- Подпись автора фото -->
            <div class="toggle-row">
                <label>Подпись автора фото</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggleCredit" onchange="updateCanvas()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div id="creditInputRow" style="display:none; margin-top:8px; margin-bottom:8px;">
                <input type="text" id="creditInput" value="Автор фото: Иван Иванов" oninput="updateCanvas()">
            </div>

            <!-- ==================== ЛОГОТИПЫ СПОНСОРОВ ==================== -->
            <div class="sub-section">
                <div class="toggle-row">
                    <label>Логотипы спонсоров</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleLogo" checked onchange="updateCanvas()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>

                <!-- Количество логотипов: 1, 2 или 3 -->
                <div class="input-group" style="margin-top:8px;">
                    <label>Количество логотипов</label>
                    <div class="logo-count-buttons">
                        <button class="logo-count-btn active" data-count="1" onclick="setLogoCount(this)">1</button>
                        <button class="logo-count-btn" data-count="2" onclick="setLogoCount(this)">2</button>
                        <button class="logo-count-btn" data-count="3" onclick="setLogoCount(this)">3</button>
                    </div>
                </div>

                <!-- Размер (общий для всех логотипов) -->
                <div class="input-group">
                    <label>Размер логотипов</label>
                    <div class="slider-row">
                       <input type="range" id="logoSizeSlider" min="70" max="120" value="80" step="1" oninput="updateCanvas()">
                        <span class="slider-value" id="logoSizeValue">50px</span>
                    </div>
                </div>

                <!-- Позиция логотипа (меняется в зависимости от количества) -->
                <div class="input-group" id="logoPositionGroup">
                    <label id="logoPositionLabel">Позиция логотипа</label>
                    <!-- Для 1 логотипа: полная сетка 3x2 -->
                    <div class="logo-position-grid" id="logoPositionGrid1">
                        <button class="logo-pos-btn" data-pos="top-left" onclick="setLogoPosition(this)">↖</button>
                        <button class="logo-pos-btn" data-pos="top-center" onclick="setLogoPosition(this)">↑</button>
                        <button class="logo-pos-btn" data-pos="top-right" onclick="setLogoPosition(this)">↗</button>
                        <button class="logo-pos-btn" data-pos="bottom-left" onclick="setLogoPosition(this)">↙</button>
                        <button class="logo-pos-btn" data-pos="bottom-center" onclick="setLogoPosition(this)">↓</button>
                        <button class="logo-pos-btn active" data-pos="bottom-right" onclick="setLogoPosition(this)">↘</button>
                    </div>
                    <!-- Для 2-3 логотипов: только верх/низ -->
                    <div class="logo-position-simple" id="logoPositionGrid23" style="display:none;">
                        <button class="logo-pos-simple-btn active" data-pos="top" onclick="setLogoVerticalPosition(this)">⬆ Сверху</button>
<button class="logo-pos-simple-btn" data-pos="bottom" onclick="setLogoVerticalPosition(this)">⬇ Снизу</button>
                    </div>
                </div>

               <div class="input-group">
    <label>Логотипы</label>

    <!-- Логотип 1 -->
    <div class="logo-upload-row" id="logoUploadRow1">
        <div class="logo-upload-box" id="logoBox1" onclick="document.getElementById('logoFile1').click()">
            <input type="file" id="logoFile1" accept="image/*" onchange="handleLogoUpload(1, event)">
            <span class="logo-upload-placeholder" id="logoPlaceholder1" style="display:none;">1</span>
            <img id="logoPreview1" class="logo-preview-img" src="assets/logo1.svg" alt="">
        </div>
        <div class="logo-row-right">
            <span class="logo-upload-label">Логотип 1</span>
            <div class="logo-individual-slider">
                <input type="range" id="logoIndSize1" min="50" max="150" value="100" step="1" oninput="updateCanvas()">
                <span class="slider-value" id="logoIndSizeValue1">100%</span>
            </div>
        </div>
        <button class="logo-swap-btn" onclick="swapLogos(1, 2)" title="Поменять местами">⇄</button>
        <button class="logo-remove-btn" id="logoRemove1" onclick="removeLogo(1)">✕</button>
    </div>

    <!-- Логотип 2 -->
    <div class="logo-upload-row" id="logoUploadRow2">
        <div class="logo-upload-box" id="logoBox2" onclick="document.getElementById('logoFile2').click()">
            <input type="file" id="logoFile2" accept="image/*" onchange="handleLogoUpload(2, event)">
            <span class="logo-upload-placeholder" id="logoPlaceholder2" style="display:none;">2</span>
            <img id="logoPreview2" class="logo-preview-img" src="assets/logo2.svg" alt="">
        </div>
        <div class="logo-row-right">
            <span class="logo-upload-label">Логотип 2</span>
            <div class="logo-individual-slider">
                <input type="range" id="logoIndSize2" min="50" max="150" value="100" step="1" oninput="updateCanvas()">
                <span class="slider-value" id="logoIndSizeValue2">100%</span>
            </div>
        </div>
        <button class="logo-swap-btn" onclick="swapLogos(2, 3)" title="Поменять местами">⇄</button>
        <button class="logo-remove-btn" id="logoRemove2" onclick="removeLogo(2)">✕</button>
    </div>

    <!-- Логотип 3 -->
    <div class="logo-upload-row" id="logoUploadRow3">
        <div class="logo-upload-box" id="logoBox3" onclick="document.getElementById('logoFile3').click()">
            <input type="file" id="logoFile3" accept="image/*" onchange="handleLogoUpload(3, event)">
            <span class="logo-upload-placeholder" id="logoPlaceholder3" style="display:none;">3</span>
            <img id="logoPreview3" class="logo-preview-img" src="assets/logo3.svg" alt="">
        </div>
        <div class="logo-row-right">
            <span class="logo-upload-label">Логотип 3</span>
            <div class="logo-individual-slider">
                <input type="range" id="logoIndSize3" min="50" max="150" value="70" step="1" oninput="updateCanvas()">
<span class="slider-value" id="logoIndSizeValue3">70%</span>
            </div>
        </div>
        <button class="logo-remove-btn" id="logoRemove3" onclick="removeLogo(3)">✕</button>
    </div>
</div>
    </div>
    </div>

        <!-- СКАЧИВАНИЕ -->
        <div class="section">
            <div class="section-title">💾 Скачать</div>
            <div class="download-buttons">
                <button class="btn-download btn-primary" onclick="downloadPost(false)">
                    📥 Скачать пост (PNG)
                </button>
                <button class="btn-download btn-secondary" onclick="downloadPost(true)">
                    🔲 Скачать подложку (без фото)
                </button>
            </div>
        </div>

    </div>

    <!-- ==================== ХОЛСТ ==================== -->
    <div class="canvas-area">
        <div>
            <div class="canvas-wrapper">
                <div class="canvas" id="postCanvas">

                    <div class="canvas-placeholder-pattern" id="placeholderPattern"></div>
                    <div class="canvas-bg" id="canvasBg"></div>
                    <div class="canvas-overlay-dim" id="canvasDim"></div>

                    <div class="identity-layer" id="identityLayer">
                        <div class="identity-frame" id="idFrame"></div>
                        
                    </div>

                    <div class="identity-accent-line" id="accentLine"></div>

                    <!-- Текстовый блок -->
                    <div class="canvas-text-block" id="textBlock">
                        <div class="canvas-heading" id="canvasHeading">важная информация</div>
                        <div class="canvas-subtext" id="canvasSubtext">описание вашего поста</div>
                    </div>
                                        <!-- Подпись автора фото -->
                    <div class="photo-credit" id="photoCredit" style="display:none;">Автор фото: Иван Иванов</div>

                    <!-- Контейнер для логотипов спонсоров -->
                    <div class="sponsor-logos-container" id="sponsorLogosContainer">
                        <!-- Логотип 1 — текстовый по умолчанию, заменяется картинкой -->
                        <div class="sponsor-logo" id="sponsorLogo1">
                            <span class="logo-dot"></span>
                            <span class="sponsor-logo-text">BRAND</span>
                            <img class="sponsor-logo-img" id="sponsorLogoImg1" style="display:none;" alt="">
                        </div>
                        <!-- Логотип 2 -->
                        <div class="sponsor-logo" id="sponsorLogo2" style="display:none;">
                            <span class="logo-dot"></span>
                            <span class="sponsor-logo-text">BRAND</span>
                            <img class="sponsor-logo-img" id="sponsorLogoImg2" style="display:none;" alt="">
                        </div>
                        <!-- Логотип 3 -->
                        <div class="sponsor-logo" id="sponsorLogo3" style="display:none;">
                            <span class="logo-dot"></span>
                            <span class="sponsor-logo-text">BRAND</span>
                            <img class="sponsor-logo-img" id="sponsorLogoImg3" style="display:none;" alt="">
                        </div>
                    </div>

                </div>
            </div>
            <div class="canvas-format-label" id="formatLabel">Instagram — 1080×1080</div>
        </div>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
